name: Build Pixel 1 Android 10 NFS Kernel

on:
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发

jobs:
  build-kernel:
    runs-on: ubuntu-20.04
    steps:
      - name: 1. 安装基础编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev bzip2 libssl-dev bc \
            flex bison git-core lz4 ccache libelf-dev zip curl

      - name: 2. 拉取交叉编译器与 Android 10 内核源码
        run: |
          # 克隆 AOSP GCC 4.9 工具链
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-10.0.0_r47 toolchain
          
          # 克隆 Pixel 1 专用于 Android 10 的官方内核源码分支
          git clone --depth=1 https://android.googlesource.com/kernel/msm.git -b android-msm-marlin-3.18-android10 kernel
          
          # 克隆 AnyKernel3 打包模版
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: 3. 注入 NFS 配置并执行编译
        run: |
          cd kernel
          
          # 向 marlin_defconfig 追加完整的 NFS 客户端支持
          cat << 'EOF' >> arch/arm64/configs/marlin_defconfig
          CONFIG_NETWORK_FILESYSTEMS=y
          CONFIG_NFS_FS=y
          CONFIG_NFS_V2=y
          CONFIG_NFS_V3=y
          CONFIG_NFS_V3_ACL=y
          CONFIG_NFS_V4=y
          CONFIG_NFS_V4_1=y
          CONFIG_NFS_V4_2=y
          CONFIG_SUNRPC=y
          CONFIG_SUNRPC_GSS=y
          CONFIG_LOCKD=y
          EOF
          
          # 设置交叉编译环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-
          
          # 生成 .config 并编译
          make marlin_defconfig
          make -j$(nproc)

      - name: 4. 打包为 AnyKernel3 卡刷 Zip
        run: |
          # 复制生成的带 DTB 镜像到 AnyKernel3 目录
          cp kernel/arch/arm64/boot/Image.lz4-dtb anykernel/Image.lz4-dtb
          
          cd anykernel
          # 配置 AnyKernel3 适配 Pixel 1 (marlin/sailfish) 及 A/B 分区
          sed -i 's/device.name1=.*/device.name1=marlin\ndevice.name2=sailfish\ndevice.name3=Pixel\ndevice.name4=Pixel XL/' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/' anykernel.sh
          
          # 生成最终 Zip 包
          zip -r9 ../Pixel1-Android10-NFS-Kernel.zip * -x .git README.md *placeholder

      - name: 5. 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1-Android10-NFS-Kernel
          path: Pixel1-Android10-NFS-Kernel.zip
