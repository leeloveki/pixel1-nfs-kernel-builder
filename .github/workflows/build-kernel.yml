name: Build Pixel 1 Android 10 NFS Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. 适配 Ubuntu 24.04 并安装必要依赖
        run: |
          sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::Retries="1"
          sudo apt-get install -y --no-install-recommends \
            libncurses-dev libncurses6 lz4 libssl-dev bc bison flex zip build-essential

          # 建立 libncurses 兼容软链接
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: 2. 克隆 64 位与 32 位工具链及内核源码
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-10.0.0_r47 toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b android-10.0.0_r47 toolchain-arm32
          git clone --depth=1 https://android.googlesource.com/kernel/msm.git -b android-msm-marlin-3.18-android10 kernel
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: 3. 注入配置、切换为 Gzip 并编译内核
        run: |
          cd kernel
          
          # 1. 修复 thermal_core.c 相对路径引用
          sed -i 's|<../base/base.h>|"../base/base.h"|g' drivers/thermal/thermal_core.c
          
          # 2. 修复 GCC 10+ dtc 变量冲突
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/^HOSTCFLAGS   :=/HOSTCFLAGS   := -fcommon /' Makefile
          
          # 3. 【关键修复】禁用 LZ4 并切换为 Gzip 压缩
          sed -i 's/CONFIG_BUILD_ARM64_APPENDED_LZ4_IMAGE=y/# CONFIG_BUILD_ARM64_APPENDED_LZ4_IMAGE is not set/' arch/arm64/configs/marlin_defconfig
          sed -i 's/CONFIG_KERNEL_LZ4=y/# CONFIG_KERNEL_LZ4 is not set/' arch/arm64/configs/marlin_defconfig
          
          # 4. 注入 NFS 支持与 Gzip 配置
          cat << 'EOF' >> arch/arm64/configs/marlin_defconfig
          CONFIG_KERNEL_GZIP=y
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          CONFIG_NETWORK_FILESYSTEMS=y
          CONFIG_NFS_FS=y
          CONFIG_NFS_V2=y
          CONFIG_NFS_V3=y
          CONFIG_NFS_V3_ACL=y
          CONFIG_NFS_V4=y
          CONFIG_NFS_V4_1=y
          CONFIG_NFS_V4_2=y
          CONFIG_SUNRPC=y
          CONFIG_SUNRPC_GSS=y
          CONFIG_LOCKD=y
          CONFIG_DNS_RESOLVER=y
          CONFIG_KEYS=y
          CONFIG_CRYPTO_MD5=y
          CONFIG_CRYPTO_DES=y
          CONFIG_CRYPTO_CBC=y
          # CONFIG_DEBUG_INFO is not set
          EOF
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchain-arm32/bin/arm-linux-androideabi-
          
          make marlin_defconfig
          make olddefconfig
          
          # 【关键修复】显式构建 Image.gz-dtb 目标
          make -j$(nproc) Image.gz-dtb dtbs KCFLAGS="-w" || make -j1 Image.gz-dtb dtbs KCFLAGS="-w"

      - name: 4. 打包 AnyKernel3 卡刷包
        run: |
          cp kernel/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cd anykernel
          rm -f Image.lz4-dtb
          
          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Pixel 1 Android 10 NFS Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marlin
          device.name2=sailfish
          device.name3=Pixel
          device.name4=Pixel XL
          supported.versions=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          
          zip -r9 ../Pixel1-Android10-NFS-Kernel.zip * -x .git README.md *placeholder

      - name: 5. 上传生成的内核卡刷包
        uses: actions/upload-artifact@v4
        with:
          name: Pixel1-Android10-NFS-Kernel
          path: Pixel1-Android10-NFS-Kernel.zip
